<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>観劇記録入力</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; }
        form { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        div { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h2>観劇記録を入力</h2>
    <form action="/add" method="post">
        <div><label>日付</label><input type="date" name="date" required></div>
        <div><label>時間</label><input type="time" name="time"></div>
        <div><label>舞台タイトル</label><input type="text" name="title" required></div>
        <div><label>劇場</label><input type="text" name="theater"></div>
        <div><label>最寄駅</label><input type="text" name="station"></div>
        <div><label>座席</label><input type="text" name="seat"></div>
        <div><label>扱い</label><input type="text" name="contact" value=""></div>
        <button type="submit">スプレッドシートに保存</button>
    </form>
</body>
</html>
